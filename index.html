<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>டிபன் கடை பில்</title>
<style>
  :root {
    --leaf: #1f5c3a;
    --leaf-dark: #143f28;
    --turmeric: #f2b705;
    --paper: #fbf8f0;
    --ink: #1d1d1b;
    --line: #e2dccb;
    --red: #b3261e;
    --white: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans Tamil", "Latha", "Nirmala UI", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding-bottom: 150px;
  }
  header {
    background: var(--leaf);
    color: var(--white);
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    font-size: 20px;
    font-weight: 700;
  }
  nav { display: flex; background: var(--leaf-dark); }
  nav button {
    flex: 1; padding: 12px; border: 0; background: transparent;
    color: #cfe3d6; font: inherit; font-size: 16px; font-weight: 600;
    border-bottom: 4px solid transparent;
  }
  nav button.active { color: var(--white); border-bottom-color: var(--turmeric); }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 16px; margin: 18px 0 8px; color: var(--leaf-dark); }

  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .item-btn {
    background: var(--white); border: 2px solid var(--line); border-radius: 12px;
    padding: 14px 10px; text-align: left; font: inherit; color: var(--ink);
    display: flex; flex-direction: column; gap: 4px; min-height: 76px;
  }
  .item-btn:active { background: #fff4cc; border-color: var(--turmeric); }
  .item-btn .n { font-size: 17px; font-weight: 700; }
  .item-btn .p { font-size: 15px; color: var(--leaf); font-weight: 600; }

  .bill-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
    background: var(--white); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .bill-row .name { font-weight: 700; }
  .bill-row .sub { font-size: 13px; color: #6b665a; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--leaf);
    background: var(--white); color: var(--leaf); font-size: 20px; font-weight: 700; line-height: 1;
  }
  .qty span { min-width: 22px; text-align: center; font-weight: 700; }
  .line-total { font-weight: 700; min-width: 56px; text-align: right; }
  .empty { color: #6b665a; padding: 10px 2px; }

  .total-bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--white);
    border-top: 3px solid var(--turmeric);
    padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .total-inner { max-width: 640px; margin: 0 auto; }
  .total-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .total-line .label { font-size: 16px; font-weight: 600; }
  .total-line .amount { font-size: 30px; font-weight: 800; color: var(--leaf-dark); }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 0; font: inherit;
    font-size: 16px; font-weight: 700;
  }
  .btn.primary { background: var(--leaf); color: var(--white); }
  .btn.ghost { background: #f1ede0; color: var(--ink); }
  .btn.danger { background: #fbe9e7; color: var(--red); }

  .field { display: flex; gap: 8px; margin-bottom: 10px; }
  .field input {
    flex: 1; min-width: 0; padding: 12px; font: inherit; font-size: 16px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--white);
  }
  .field input:focus { outline: 3px solid var(--turmeric); border-color: var(--leaf); }
  .field input.price { flex: 0 0 90px; }
  .menu-row {
    display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: center;
    background: var(--white); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .menu-row input {
    width: 100%; padding: 8px; font: inherit; font-size: 15px;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .menu-row .del {
    border: 0; background: #fbe9e7; color: var(--red); border-radius: 8px;
    padding: 8px 10px; font: inherit; font-weight: 700;
  }
  button:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }
  .hidden { display: none; }
  .toast {
    position: fixed; left: 50%; top: 70px; transform: translateX(-50%);
    background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 20px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>🍛 டிபன் கடை பில்</header>
<nav>
  <button id="tabBill" class="active">பில் போடு</button>
  <button id="tabMenu">மெனு மாற்று</button>
</nav>

<!-- பில் பக்கம் -->
<main id="billPage">
  <h2>உணவைத் தொட்டால் பில்லில் சேரும்</h2>
  <div class="menu-grid" id="menuGrid"></div>

  <h2>இந்த பில்</h2>
  <div id="billList"></div>
</main>

<!-- மெனு பக்கம் -->
<main id="menuPage" class="hidden">
  <h2>புதிய உணவு சேர்</h2>
  <div class="field">
    <input id="newName" type="text" placeholder="உணவின் பெயர்" autocomplete="off">
    <input id="newPrice" class="price" type="number" inputmode="decimal" min="0" placeholder="விலை ₹">
  </div>
  <button class="btn primary" id="addItem" style="width:100%">சேர்</button>

  <h2>உள்ள உணவுகள் (பெயர், விலையை மாற்றலாம்)</h2>
  <div id="menuEdit"></div>
  <button class="btn ghost" id="resetMenu" style="width:100%;margin-top:8px">ஆரம்ப மெனுவுக்கு மாற்று</button>
</main>

<!-- கூடுதல் -->
<div class="total-bar" id="totalBar">
  <div class="total-inner">
    <div class="total-line">
      <span class="label">கூடுதல்</span>
      <span class="amount" id="grandTotal">₹0</span>
    </div>
    <div class="actions">
      <button class="btn danger" id="clearBill">புதிய பில்</button>
      <button class="btn primary" id="copyBill">பில்லை நகலெடு</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var DEFAULT_MENU = [
    { name: "இட்லி", price: 10 },
    { name: "தோசை", price: 30 },
    { name: "பொங்கல்", price: 40 },
    { name: "வடை", price: 10 },
    { name: "பூரி", price: 40 },
    { name: "பரோட்டா", price: 15 },
    { name: "சப்பாத்தி", price: 15 },
    { name: "உப்புமா", price: 30 },
    { name: "டீ", price: 10 },
    { name: "காபி", price: 15 }
  ];

  var menu = load("tiffin_menu", DEFAULT_MENU);
  var bill = {}; // index -> qty

  function load(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : JSON.parse(JSON.stringify(fallback));
    } catch (e) {
      return JSON.parse(JSON.stringify(fallback));
    }
  }
  function saveMenu() {
    try { localStorage.setItem("tiffin_menu", JSON.stringify(menu)); } catch (e) {}
  }
  function $(id) { return document.getElementById(id); }
  function rupees(n) { return "₹" + (Math.round(n * 100) / 100); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1600);
  }

  /* ---------- பில் பக்கம் ---------- */
  function renderGrid() {
    var g = $("menuGrid");
    g.textContent = "";
    if (!menu.length) {
      g.appendChild(el("div", "empty", "மெனுவில் உணவு இல்லை. 'மெனு மாற்று' பக்கத்தில் சேர்க்கவும்."));
      return;
    }
    menu.forEach(function (it, i) {
      var b = el("button", "item-btn");
      b.appendChild(el("span", "n", it.name));
      b.appendChild(el("span", "p", rupees(it.price)));
      b.addEventListener("click", function () {
        bill[i] = (bill[i] || 0) + 1;
        renderBill();
      });
      g.appendChild(b);
    });
  }

  function renderBill() {
    var list = $("billList");
    list.textContent = "";
    var total = 0, any = false;
    Object.keys(bill).forEach(function (k) {
      var i = Number(k), q = bill[k], it = menu[i];
      if (!it || !q) return;
      any = true;
      var line = it.price * q;
      total += line;

      var row = el("div", "bill-row");
      var left = el("div");
      left.appendChild(el("div", "name", it.name));
      left.appendChild(el("div", "sub", rupees(it.price) + " × " + q));
      row.appendChild(left);

      var qty = el("div", "qty");
      var minus = el("button", "", "−");
      minus.setAttribute("aria-label", "குறை");
      minus.addEventListener("click", function () {
        bill[i] = q - 1;
        if (bill[i] <= 0) delete bill[i];
        renderBill();
      });
      var plus = el("button", "", "+");
      plus.setAttribute("aria-label", "கூட்டு");
      plus.addEventListener("click", function () { bill[i] = q + 1; renderBill(); });
      qty.appendChild(minus);
      qty.appendChild(el("span", "", String(q)));
      qty.appendChild(plus);
      row.appendChild(qty);

      row.appendChild(el("div", "line-total", rupees(line)));
      list.appendChild(row);
    });
    if (!any) list.appendChild(el("div", "empty", "இன்னும் எதுவும் சேர்க்கவில்லை."));
    $("grandTotal").textContent = rupees(total);
  }

  $("clearBill").addEventListener("click", function () {
    if (Object.keys(bill).length && !confirm("இந்த பில்லை அழித்து புதிதாக தொடங்கவா?")) return;
    bill = {};
    renderBill();
  });

  $("copyBill").addEventListener("click", function () {
    var lines = [], total = 0;
    Object.keys(bill).forEach(function (k) {
      var it = menu[Number(k)], q = bill[k];
      if (!it || !q) return;
      lines.push(it.name + " " + q + " × " + it.price + " = " + (it.price * q));
      total += it.price * q;
    });
    if (!lines.length) { toast("பில்லில் எதுவும் இல்லை"); return; }
    lines.push("கூடுதல்: ₹" + total);
    var text = lines.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { toast("நகலெடுக்கப்பட்டது"); },
        function () { toast("நகலெடுக்க முடியவில்லை"); }
      );
    } else {
      toast("நகலெடுக்க முடியவில்லை");
    }
  });

  /* ---------- மெனு பக்கம் ---------- */
  function renderMenuEdit() {
    var box = $("menuEdit");
    box.textContent = "";
    menu.forEach(function (it, i) {
      var row = el("div", "menu-row");
      var n = document.createElement("input");
      n.type = "text"; n.value = it.name;
      n.addEventListener("change", function () {
        var v = n.value.trim();
        if (!v) { n.value = it.name; return; }
        it.name = v; saveMenu(); renderGrid(); renderBill();
      });
      var p = document.createElement("input");
      p.type = "number"; p.inputMode = "decimal"; p.min = "0"; p.value = it.price;
      p.addEventListener("change", function () {
        var v = parseFloat(p.value);
        if (isNaN(v) || v < 0) { p.value = it.price; return; }
        it.price = v; saveMenu(); renderGrid(); renderBill();
      });
      var d = el("button", "del", "நீக்கு");
      d.addEventListener("click", function () {
        if (!confirm(it.name + " ஐ நீக்கவா?")) return;
        menu.splice(i, 1);
        bill = {}; // குறியீடுகள் மாறுவதால் பில் அழிகிறது
        saveMenu(); renderMenuEdit(); renderGrid(); renderBill();
      });
      row.appendChild(n); row.appendChild(p); row.appendChild(d);
      box.appendChild(row);
    });
  }

  $("addItem").addEventListener("click", function () {
    var name = $("newName").value.trim();
    var price = parseFloat($("newPrice").value);
    if (!name) { toast("உணவின் பெயரை எழுதவும்"); return; }
    if (isNaN(price) || price < 0) { toast("சரியான விலையை எழுதவும்"); return; }
    menu.push({ name: name, price: price });
    $("newName").value = ""; $("newPrice").value = "";
    saveMenu(); renderMenuEdit(); renderGrid();
    toast(name + " சேர்க்கப்பட்டது");
  });

  $("resetMenu").addEventListener("click", function () {
    if (!confirm("மெனுவை ஆரம்ப நிலைக்கு மாற்றவா? உங்கள் மாற்றங்கள் அழியும்.")) return;
    menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
    bill = {};
    saveMenu(); renderMenuEdit(); renderGrid(); renderBill();
  });

  /* ---------- பக்கம் மாற்றம் ---------- */
  function show(which) {
    var isBill = which === "bill";
    $("billPage").classList.toggle("hidden", !isBill);
    $("menuPage").classList.toggle("hidden", isBill);
    $("totalBar").classList.toggle("hidden", !isBill);
    $("tabBill").classList.toggle("active", isBill);
    $("tabMenu").classList.toggle("active", !isBill);
  }
  $("tabBill").addEventListener("click", function () { show("bill"); });
  $("tabMenu").addEventListener("click", function () { show("menu"); });

  renderGrid(); renderBill(); renderMenuEdit();
})();
</script>
</body>
</html>
